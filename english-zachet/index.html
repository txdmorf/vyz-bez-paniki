<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>wordroom — Зачёт Английский</title><style>*{box-sizing:border-box}body{margin:0;font:17px -apple-system,BlinkMacSystemFont,Arial;color:#111}header{background:#f0f4ea;padding:26px max(20px,5vw)}.brand{font-size:30px;font-weight:850;letter-spacing:-1px}.brand:before{content:"w.";color:#d5e5a8;margin-right:20px}nav{display:flex;gap:8px;overflow:auto;margin-top:25px}button{font:inherit;cursor:pointer;border:0;border-radius:15px;padding:14px 17px;background:#e4eada;color:#111}nav button{white-space:nowrap}button.active{background:#cad9bd}main{max-width:760px;margin:auto;padding:42px 22px}h1{font-size:clamp(36px,8vw,64px);letter-spacing:-2px;line-height:1.06;margin:12px 0 24px}p{line-height:1.6}.muted{color:#65705d}.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:28px 0}.mode{padding:20px;text-align:left;background:#f4f4f0;min-height:115px;font-weight:700}.mode small{display:block;margin-top:8px;font-weight:400}.card{margin:24px 0;border:1px solid #d9e3d0;border-radius:24px;background:#f1f5e9;min-height:235px;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;font-size:32px;font-weight:750;cursor:pointer;touch-action:manipulation;user-select:none}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{flex:1}.search{width:100%;font:inherit;padding:15px;border:1px solid #ccc;border-radius:12px}.item{padding:18px 0;border-bottom:1px solid #eee}.item b{display:block;font-size:22px}.answer{display:block;width:100%;margin:8px 0;text-align:left;background:#f1f4ec}.stat{margin:20px 0;font-weight:700}input{font:inherit}.hide{display:none}@media(max-width:420px){.modes{grid-template-columns:1fr}main{padding-top:28px}}</style><header><div class="brand">wordroom•</div><nav><button id="n0" onclick="tab(0)">▣ Учить слова</button><button id="n1" onclick="tab(1)">☷ Весь глоссарий</button><button id="n2" onclick="tab(2)">↻ Трудные слова</button></nav></header><main><div class="muted">ТВОЁ МЕСТО ДЛЯ АНГЛИЙСКОГО · ПРОГРЕСС НА ЭТОМ УСТРОЙСТВЕ</div><div id="app"></div></main><script>const words=[["ability","способность"],["achieve goals","достигать целей"],["acquire","приобретать, получать"],["allocate","распределять, выделять"],["annual","ежегодный"],["annual turnover","годовой оборот"],["appoint","назначать"],["approach","подход"],["approachable","открытый для общения"],["be in charge of","отвечать за"],["board","совет директоров"],["bond","облигация"],["business","бизнес"],["cautious","осторожный"],["chairman","председатель"],["compete","конкурировать"],["competitive","конкурентоспособный"],["compliance","соблюдение требований"],["confident","уверенный"],["consume","потреблять"],["contribute","вносить вклад"],["contribution to","вклад в"],["convince","убеждать"],["deal with","иметь дело с"],["disseminate","распространять"],["diversified","диверсифицированный"],["employ","нанимать"],["employee","сотрудник"],["employer","работодатель"],["employment","занятость"],["establish","основывать"],["exact costs","точные затраты"],["expand","расширять"],["exude","излучать"],["gain","получать"],["go bankrupt","обанкротиться"],["hand over","передавать"],["implement","внедрять"],["income","доход"],["initial","первоначальный"],["initiative","инициатива"],["integrity","честность, порядочность"],["layoff","сокращение"],["legal","законный"],["limited company","компания с ограниченной ответственностью"],["manage","управлять"],["mitigate","смягчать"],["objective","цель"],["overall","общий"],["partnership","партнёрство"],["predecessor","предшественник"],["priority","приоритет"],["private company","частная компания"],["profit","прибыль"],["prosperity","процветание"],["provide","предоставлять"],["public company","публичная компания"],["corporation","корпорация"],["refund","возврат денег"],["require","требовать"],["resignation","отставка"],["retain","сохранять"],["run a company","управлять ко holder="Найти слово или перевод" oninput="listing()"><div id="listing"></div>';listing();return}if(mode==='home'){home();return}if(!pool.length){app.innerHTML='<h1>Пока нет трудных слов</h1><button onclick="tab(0)">Учить слова</button>';return}let w=pool[i%pool.length];app.innerHTML='<div class="muted">СЛОВО '+(i%pool.length+1)+' ИЗ '+pool.length+' · ЗАКРЕПЛЕНО '+known.size+'</div><h1>'+({cards:'Карточки',quiz:'Выбери перевод',write:'Напиши слово',definition:'По определению',listen:'На слух',pairs:'Найди пары'}[mode])+'</h1><div id="exercise"></div><div class="actions"><button onclick="home()">Все режимы</button><button onclick="next()">Следующее →</button></div>';const ex=document.getElementById('exercise');if(mode==='cards'){ex.innerHTML='<div class="card" id="flip" role="button" tabindex="0" onclick="flip()" onkeydown="if(event.key===\'Enter\')flip()">'+(flipped?w[1]:w[0])+'</div><div class="actions"><button onclick="mark(false)">✕ Трудно</button><button onclick="mark(true)">✓ Знаю</button></div><p class="muted">Нажми на карточку, чтобы перевернуть</p>'}else if(mode==='quiz'||mode==='definition'){let choices=[w,...words.filter(x=>x!==w).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);ex.innerHTML='<div class="card">'+(mode==='quiz'?w[0]:w[1])+'</div>'+choices.map(x=>'<button class="answer" onclick="check('+words.indexOf(x)+')">'+(mode==='quiz'?x[1]:x[0])+'</button>').join('')+'<p id="feedback"></p>'}else if(mode==='write'||mode==='listen'){ex.innerHTML='<div class="card">'+(mode==='write'?w[1]:'🔊 Нажми, чтобы услышать слово')+'</div>'+(mode==='listen'?'<button onclick="speak()">▶ Произнести</button>':'')+'<p><input class="search" id="typed" autocomplete="off" placeholder="Напиши слово на английском"></p><button onclick="checkText()">Проверить</button><p id="feedback"></p>'}else{let choices=[w,...words.filter(x=>x!==w).sort(()=>Math.random()-.5).slice(0,4)];ex.innerHTML='<p>Выбери перевод слова <b>'+w[0]+'</b></p>'+choices.sort(()=>Math.random()-.5).map(x=>'<button class="answer" onclick="check('+words.indexOf(x)+')">'+x[1]+'</button>').join('')+'<p id="feedback"></p>'}}function home(){mode='home';app.innerHTML='<h1>Зачёт<br>Английский</h1><p>Твои слова уже здесь. Выбери способ и начни учить.</p><div class="stat">'+words.length+' слов · '+known.size+' закреплено · '+wrong.size+' трудных</div><h2>Как будем учить?</h2><div class="modes">'+[['cards','Карточки','EN ↔ RU'],['quiz','Выбери перевод','Один ответ из четырёх'],['write','Напиши слово','Активная память'],['definition','По определению','Узнай слово по переводу'],['listen','На слух','Произношение'],['pairs','Найди пары','Соедини слово с переводом']].map(x=>'<button class="mode" onclick="start(\''+x[0]+'\')">'+x[1]+'<small>'+x[2]+'</small></button>').join('')+'</div>'}function start(m){mode=m;i=0;flipped=false;pool=words;render()}function flip(){flipped=!flipped;document.getElementById('flip').textContent=flipped?pool[i%pool.length][1]:pool[i%pool.length][0]}function next(){i++;flipped=false;render()}function mark(ok){let k=pool[i%pool.length][0];if(ok){known.add(k);wrong.delete(k)}else{wrong.add(k);known.delete(k)}save();next()}function check(idx){let ok=words[idx][0]===pool[i%pool.length][0];document.getElementById('feedback').textContent=ok?'✓ Верно!':'✕ Попробуй ещё. Правильный ответ: '+pool[i%pool.length][1];if(ok)known.add(pool[i%pool.length][0]);else wrong.add(pool[i%pool.length][0]);save()}function checkText(){let ok=document.getElementById('typed').value.trim().toLowerCase()===pool[i%pool.length][0].toLowerCase();document.getElementById('feedback').textContent=ok?'✓ Верно!':'Правильный ответ: '+pool[i%pool.length][0];if(ok)known.add(pool[i%pool.length][0]);else wrong.add(pool[i%pool.length][0]);save()}function speak(){if('speechSynthesis'in window){let u=new SpeechSynthesisUtterance(pool[i%pool.length][0]);u.lang='en-US';speechSynthesis.speak(u)}}function listing(){let q=(document.getElementById('search')?.value||'').toLowerCase(),a=(tabId===2?wo
