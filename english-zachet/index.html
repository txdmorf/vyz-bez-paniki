){if(!words.some(x=>x[0].toLowerCase()===w[0].toLowerCase()))words.push(w)}const unitOf=(w)=>Math.min(4,Math.floor(words.indexOf(w)/Math.ceil(words.length/4))+1);let selectedUnit=0;function selectedWords(){return selectedUnit===0?words:words.filter(w=>unitOf(w)===selectedUnit)}function selectUnit(n){selectedUnit=n;pool=selectedWords();i=0;flipped=false;tabId=0;mode='home';home();document.querySelectorAll('.unit').forEach((b,j)=>b.classList.toggle('active',j===n))}document.querySelector('main').insertAdjacentHTML('afterbegin','<div style="display:flex;gap:7px;overflow:auto;margin:0 0 25px">'+['Все','Юнит 1','Юнит 2','Юнит 3','Юнит 4'].map((t,j)=>'<button class="unit '+(j===0?'active':'')+'" onclick="selectUnit('+j+')">'+t+'</button>').join('')+'</div>');const app=document.getElementById('app');function save(){localStorage.setItem('wordroom_wrong',JSON.stringify([...wrong]));localStorage.setItem('wordroom_known',JSON.stringify([...known]))}function tab(n){tabId=n;mode='cards';i=0;pool=n===2?selectedWords().filter(w=>wrong.has(w[0])):selectedWords();render()}function render(){for(let n=0;n<3;n++)document.getElementById('n'+n).classList.toggle('active',n===tabId);if(tabId===1||tabId===2){app.innerHTML='<h1>'+(tabId===1?'Твой глоссарий':'Трудные слова')+'</h1><p>Нажми на слово, чтобы увидеть перевод и отметить сложное.</p><input class="search" id="search" placeholder="Найти слово или перевод" oninput="listing()"><div id="listing"></div>';listing();return}if(mode==='home'){home();return}if(!pool.length){app.innerHTML='<h1>Пока нет трудных слов</h1><button onclick="tab(0)">Учить слова</button>';return}let w=pool[i%pool.length];app.innerHTML='<div class="muted">СЛОВО '+(i%pool.length+1)+' ИЗ '+pool.length+' · ЗАКРЕПЛЕНО '+known.size+'</div><h1>'+({cards:'Карточки',quiz:'Выбери перевод',write:'Напиши слово',definition:'По определению',listen:'На слух',pairs:'Найди пары'}[mode])+'</h1><div id="exercise"></div><div class="actions"><button onclick="home()">Все режимы</button><b
